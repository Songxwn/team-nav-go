<!doctype html>
<html lang="zh-CN" data-theme="light" data-accent="indigo">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f5fc">
  <meta name="description" content="团队服务导航 · 一站式访问团队的全部工具与平台">
  <title>星云导航 · 团队服务</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/theme.js"></script>
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>
  <div class="grid-overlay" aria-hidden="true"></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.5 6.5 0 0 0 9.8 9.8Z"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9L6.6 20l1-6.1L3.2 9.5l6.1-.9Z"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 5 6v6c0 4.4 3 7.6 7 9 4-1.4 7-4.6 7-9V6Z"/><path d="m9 12 2 2 4-4"/></symbol>
      <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
      <symbol id="i-megaphone" viewBox="0 0 24 24"><path d="M4 10v4a1 1 0 0 0 1 1h2l9 4V5L7 9H5a1 1 0 0 0-1 1Z"/><path d="M19 9a3.5 3.5 0 0 1 0 6"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7"/></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3A4 4 0 0 0 13 5.3l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 11 18.7l1-1"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="3"/><path d="M8.5 10V7.5a3.5 3.5 0 0 1 7 0V10"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.5 3.5-5.5 7-5.5s6.2 2 7 5.5"/></symbol>
      <symbol id="i-logout" viewBox="0 0 24 24"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M10 8l-4 4 4 4M6 12h9"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14-4L4 9"/><path d="M4 5v4h4M4 13a8 8 0 0 0 14 4l2-2"/><path d="M20 19v-4h-4"/></symbol>
      <symbol id="i-click" viewBox="0 0 24 24"><path d="m5 5 6.5 16 2.4-6.1L20 12.4Z"/></symbol>
      <symbol id="i-command" viewBox="0 0 24 24"><path d="M9 6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3Z"/></symbol>
    </defs>
  </svg>

  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="/">
        <span class="brand-mark" id="brandMark"><span aria-hidden="true">✦</span></span>
        <span class="brand-text">
          <strong id="brandName">星云导航</strong>
          <span id="brandSubtitle">团队服务，一站式入口</span>
        </span>
      </a>

      <button class="side-search" type="button" data-open-search>
        <svg class="icon"><use href="#i-search"/></svg>
        <span>搜索服务或分类</span>
        <span class="shortcut" id="searchShortcut">Ctrl K</span>
      </button>

      <div class="nav-label">导航</div>
      <nav class="cat-nav" id="categoryNav" aria-label="分类导航"></nav>

      <div class="sidebar-foot">
        <div class="user-chip" id="userChip"></div>
        <a class="btn btn-ghost btn-sm" id="adminEntry" href="/admin" hidden>
          <svg class="icon" style="width:15px;height:15px"><use href="#i-shield"/></svg>
          进入后台
        </a>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-button menu-toggle" type="button" id="menuToggle" aria-label="打开导航">
          <svg class="icon"><use href="#i-menu"/></svg>
        </button>
        <span class="date-chip"><span class="pulse"></span><span id="todayLabel"></span></span>
        <span class="spacer"></span>
        <button class="icon-button lang-toggle" type="button" id="langToggle" aria-label="切换语言" title="切换语言">
          <span id="langLabel">EN</span>
        </button>
        <button class="icon-button theme-toggle" type="button" id="themeToggle" aria-label="切换深浅色主题" title="切换主题">
          <svg class="icon sun"><use href="#i-sun"/></svg>
          <svg class="icon moon"><use href="#i-moon"/></svg>
        </button>
        <button class="btn btn-ghost" type="button" id="loginButton">
          <svg class="icon" style="width:16px;height:16px"><use href="#i-user"/></svg>
          <span class="btn-label">登录</span>
        </button>
      </header>

      <section class="hero">
        <div class="hero-copy">
          <span class="eyebrow" id="heroEyebrow">WELCOME · 星云导航</span>
          <h1>把团队的每一个服务<br><em>放在顺手的位置</em></h1>
          <p id="heroSubtitle">团队服务，一站式入口</p>
          <div class="hero-stats">
            <span class="stat-pill"><b id="statServices">0</b> <span id="unitServices">个服务</span></span>
            <span class="stat-pill"><b id="statCategories">0</b> <span id="unitCategories">个分类</span></span>
            <span class="stat-pill"><b id="statClicks">0</b> <span id="unitClicks">次访问</span></span>
          </div>
        </div>
        <div class="hero-panel">
          <button class="hero-search" type="button" data-open-search>
            <svg class="icon"><use href="#i-search"/></svg>
            <span>快速查找，试试「监控」</span>
            <span class="shortcut" id="searchShortcut2">Ctrl K</span>
          </button>
          <div class="quick-actions">
            <button class="btn btn-ghost btn-sm" type="button" id="favFilterButton">
              <svg class="icon" style="width:15px;height:15px"><use href="#i-star"/></svg>
              我的收藏
            </button>
            <button class="btn btn-primary btn-sm" type="button" id="applyButton">
              <svg class="icon" style="width:15px;height:15px"><use href="#i-plus"/></svg>
              提交卡片
            </button>
          </div>
          <div class="mini-note">
            <svg class="icon"><use href="#i-sparkle"/></svg>
            <span>收藏保存在浏览器本地；按下 <b>Ctrl K</b> 随时唤起全局搜索。</span>
          </div>
        </div>
      </section>

      <div class="filter-banner" id="favBanner">
        <svg class="icon" style="width:16px;height:16px;color:#f59e0b"><use href="#i-star"/></svg>
        <span>正在查看我的收藏</span>
        <button class="btn btn-ghost btn-sm" type="button" id="clearFavFilter">显示全部</button>
      </div>

      <div class="notice-bar" id="noticeBar" hidden></div>

      <div class="sections" id="sections" aria-live="polite">
        <div class="grid">
          <div class="skeleton skeleton-card"></div>
          <div class="skeleton skeleton-card"></div>
          <div class="skeleton skeleton-card"></div>
          <div class="skeleton skeleton-card"></div>
        </div>
      </div>

      <footer class="page-foot">
        <span id="footerText">Built with Go · SQLite</span>
        <span id="footerVersion">TeamNav</span>
      </footer>
    </main>
  </div>

  <div class="overlay" id="searchOverlay" role="dialog" aria-modal="true" aria-label="全局搜索">
    <div class="palette">
      <div class="palette-input">
        <svg class="icon"><use href="#i-search"/></svg>
        <input id="paletteInput" type="text" placeholder="搜索服务、分类或关键词…" autocomplete="off" spellcheck="false">
        <span class="shortcut">ESC</span>
      </div>
      <div class="palette-body" id="paletteBody"></div>
      <div class="palette-foot">
        <span><kbd>↑</kbd><kbd>↓</kbd> 选择</span>
        <span><kbd>↵</kbd> 打开</span>
        <span><kbd>Esc</kbd> 关闭</span>
      </div>
    </div>
  </div>

  <dialog class="modal" id="loginDialog">
    <form method="dialog" id="loginForm" novalidate>
      <div class="modal-head">
        <span class="modal-mark"><svg class="icon"><use href="#i-lock"/></svg></span>
        <div>
          <h3>登录工作台</h3>
          <p>管理员可以管理卡片、分类与站点设置</p>
        </div>
        <button class="icon-button modal-close" type="button" data-close-dialog aria-label="关闭">
          <svg class="icon"><use href="#i-x"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-error" id="loginError"></div>
        <div class="field">
          <label for="loginUsername">用户名</label>
          <input class="input" id="loginUsername" name="username" autocomplete="username" placeholder="请输入用户名" required>
        </div>
        <div class="field">
          <label for="loginPassword">密码</label>
          <input class="input" id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required>
        </div>
        <div class="modal-actions">
          <button class="btn btn-ghost" type="button" data-close-dialog>取消</button>
          <button class="btn btn-primary" type="submit" id="loginSubmit">登录</button>
        </div>
        <p class="login-switch">还没有账号？请联系管理员分配权限</p>
      </div>
    </form>
  </dialog>

  <dialog class="modal" id="applyDialog">
    <form method="dialog" id="applyForm" novalidate>
      <div class="modal-head">
        <span class="modal-mark"><svg class="icon"><use href="#i-plus"/></svg></span>
        <div>
          <h3>提交新卡片</h3>
          <p>审核通过后会出现在导航首页</p>
        </div>
        <button class="icon-button modal-close" type="button" data-close-dialog aria-label="关闭">
          <svg class="icon"><use href="#i-x"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-error" id="applyError"></div>
        <div class="field">
          <label for="applyName">服务名称</label>
          <input class="input" id="applyName" maxlength="40" placeholder="例如：Grafana" required>
        </div>
        <div class="field">
          <label for="applyURL">访问地址</label>
          <input class="input" id="applyURL" type="url" placeholder="https://example.com" required>
        </div>
        <div class="field">
          <label for="applyCategory">所属分类</label>
          <select class="select" id="applyCategory" required></select>
        </div>
        <div class="field">
          <label for="applyTags">标签</label>
          <input class="input" id="applyTags" placeholder="用逗号分隔，如：监控, 运维">
          <span class="hint">最多 6 个标签</span>
        </div>
        <div class="field">
          <label for="applyDesc">一句话描述</label>
          <textarea class="textarea" id="applyDesc" maxlength="300" placeholder="这个服务是做什么的？"></textarea>
        </div>
        <div class="modal-actions">
          <button class="btn btn-ghost" type="button" data-close-dialog>取消</button>
          <button class="btn btn-primary" type="submit" id="applySubmit">提交审核</button>
        </div>
      </div>
    </form>
  </dialog>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <script src="/assets/i18n.js" defer></script>
  <script src="/assets/app.js" defer></script>
</body>
</html>
