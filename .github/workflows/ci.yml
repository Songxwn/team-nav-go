name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, vet and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: teamnav
          POSTGRES_PASSWORD: teamnav
          POSTGRES_DB: teamnav_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teamnav"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEAMNAV_TEST_POSTGRES: postgres://teamnav:teamnav@127.0.0.1:5432/teamnav_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify formatting
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "These files need gofmt:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" ./...